<html>
    <head>
        <title>Bildbeschreibung</title>
        <style>
            .Bild {
                position: absolute;
            }
            .Bild img {
                width: 100%;
                display: block;
                border: 3px solid black;
            }
            .Bildbeschreibung {
                position: absolute;
                top: 0;
                left: 0;
                width: 99.4%;
                height: 20%;
                background-color: rgba(255, 255, 255, 0.5);
                border: 3px solid black;
            }
            .Bildbeschreibung p {
                position: left;
                margin: 10px;
                color: black;
                font-size: 2em;
                font-family: Arial, Helvetica, sans-serif;
            }
        </style>
    </head>
    <body>
        <div class="Bild">
            <img src="Dufourspitze.jpg" alt="I and my Mom are on the top the Dufour." style ="width: 960px; height: 720px;">
        
        <div class="Bildbeschreibung">
        <p>Joy und ihre Mutter auf der Dufourspitze.</p>
    </div>
    </div>
        
    </body>
</html>
