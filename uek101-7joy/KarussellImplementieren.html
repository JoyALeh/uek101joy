<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width", initial-scale="1">
        <title>Karussell implementieren</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <style>
            p {
                font-family: fantasy;
                font-size: 2em;
                background-color: rgb(75, 141, 86);
                color: rgb(255, 255, 255);

            }

            .carousel-caption {
                max-height: fit-content;
            }
        </style>
    </head>
    <body>
        <div id="carouselExample" class="carousel slide">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="BergeRichtungOberalppass.jpg" class="d-block w-100" alt="The mountains right Oberalppass.">
                    <div class="carousel-caption top-50 start-50 translate-middle">
                        <p>Turnvereinwanderung 2026</p>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="CadlimoTurnvereinGruppe.jpg" class="d-block w-100" alt="The cabin with the sport club.">
                    <div class="carousel-caption top-50 start-50 translate-middle">
                    <p>Turnvereinwanderung 2026</p>
            </div>
                </div>
                <div class="carousel-item">
                    <img src="Sonnenuntergang.jpg" class="d-block w-100" alt="The sunset with the mountains.">
                    <div class="carousel-caption top-50 start-50 translate-middle">
            <p>Turnvereinwanderung 2026</p>
            </div>
                </div>
                <div class="carousel-item">
                    <img src="StauseePiotta.jpg" class="d-block w-100" alt="The dam in Piotta.">
                    <div class="carousel-caption top-50 start-50 translate-middle">
            <p>Turnvereinwanderung 2026</p>
            </div>
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
