<html>
    <head>
        <title>LittleBambus</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                font-family: Arial, Helvetica, sans-serif;
            }
            header {
                background-color: #666;
                padding: 30px;
                text-align: center;
                font-size: 35px;
                color: white;
            }

            nav {
                float: left;
                width: 30%;
                height: 300px;
                background: #f3cf18;
                padding: 20px;
            }
            nav ul{
                list-style-type: none;
                padding: 0;
            }

            article {
                float: left;
                padding: 20px;
                width: 70%;
                background-color: #7bcb18ee;
                height: 300px;
            }
            
            section::after {
                content: "";
                display: table;
                clear: both;
                background-color: #7bcb18ee;
            }

            footer {
                background-color: #7bcb18ee;
                padding: 10px;
                text-align: center;
                color: rgb(59, 59, 59);
            }

            @media (max-width: 600px) {
                nav, article {
                    width: 100%;
                    height: auto;
                }
            }
        </style>
    </head>

    <body>

        <header>
            <img src="LittleBambus.jpg" alt="The menu is in the bambus">
        </header>
        <section>
            <nav>
                <ul><a href="#">HOME</a>
                    <a href="#">TAKE AWAY</a>
                    <a href="#">LIEFERKARTE</a>
                    <a href="#">STANDORT</a>
                </ul>
            </nav></section>

            <footer>
                <p>031 921 16 22</p>
            </footer>
    </body>
</html>
